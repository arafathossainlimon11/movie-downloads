<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Link Generated - Movie Downloads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Message Ad Box -->
    <div class="top-msg-ad" onclick="openAdLink()">
        📢 Fast Cloud Downloader Active! Click Here to Skip Wait 🚀
    </div>

    <!-- Header & Logo -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="https://i.ibb.co.com/ZzPRsbyd/file-00000000ea5882119de529e8098ae838.png" alt="Logo" class="site-logo">
            </a>
        </div>
        <div class="admin-btn-container">
            <a href="admin.html" class="admin-link">⚙️ Admin Login</a>
        </div>
    </header>

    <!-- 320x50 Banner Ad -->
    <div class="ad-320-50">
        <span>[ 320 x 50 Banner Ad Space ]</span>
    </div>

    <!-- Download Page Container -->
    <div class="download-page-container">
        <div class="download-box" id="downloadBoxInfo">
            <!-- Dynamic Download Info & Links will load here -->
        </div>
    </div>

    <!-- 320x50 Banner Ad -->
    <div class="ad-320-50">
        <span>[ 320 x 50 Banner Ad Space ]</span>
    </div>

    <script src="script.js"></script>
    <script>
        // Load Download Info on Page Open
        loadDownloadPage();

        function openAdLink() {
            window.open("https://www.profitablecpmrate.com", "_blank");
        }
    </script>
</body>
</html>
